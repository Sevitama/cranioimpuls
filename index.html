document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).

    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

splay:flex;align-items:center\"><img src=\"ae1fb9eb-38da-49b3-9dee-f79a5f417e24\" alt=\"cranioimpuls\" style=\"height:64px;width:auto;display:block\"><\u002Fa>\n    <nav style=\"display:flex;gap:28px;font-size:15px;font-weight:600;letter-spacing:.04em\">\n      <a href=\"#ueber-mich\" style=\"color:#3A3F3D\" style-hover=\"color:#3F9587\">Über mich<\u002Fa>\n      <a href=\"#behandlung\" style=\"color:#3A3F3D\" style-hover=\"color:#3F9587\">Behandlung<\u002Fa>\n      <a href=\"#kontakt\" style=\"color:#3A3F3D\" style-hover=\"color:#3F9587\">Kontakt<\u002Fa>\n    <\u002Fnav>\n  <\u002Fdiv>\n<\u002Fheader>\n\n<div aria-hidden=\"true\" style=\"position:fixed;inset:0;z-index:0;pointer-events:none;opacity:.22\"><img src=\"e68e51c0-66d1-4354-b924-577f5a87ca8c\" alt=\"\" style=\"width:100%;height:100%;object-fit:cover;object-position:center;display:block\"><\u002Fdiv>\n\n<main id=\"top\" data-screen-label=\"Startseite\" style=\"position:relative;z-index:1\">\n  <section style=\"max-width:1120px;margin:0 auto;padding:min(18vh,160px) 28px 24px\">\n    <p style=\"margin:0;font-family:'Caveat',cursive;font-size:clamp(28px,4vw,44px);color:#9B3A8A;line-height:1.1\">Stille bewegt.<\u002Fp>\n    <h1 style=\"margin:10px 0 0;font-weight:300;font-size:clamp(30px,4.6vw,52px);line-height:1.12;letter-spacing:-.01em;max-width:820px;text-wrap:pretty\">Zur Ruhe kommen in einem geschützten Raum – Craniosacral Therapie in Stäfa.<\u002Fh1>\n  <\u002Fsection>\n\n  <section id=\"ueber-mich\" style=\"max-width:1120px;margin:0 auto;padding:64px 28px\">\n    <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:56px;align-items:start\">\n      <div style=\"display:flex;flex-direction:column;gap:20px\">\n        <img src=\"9d4988e3-fc83-4020-a063-b68d2358992d\" alt=\"Monica Krauchthaler\" style=\"width:100%;aspect-ratio:1;object-fit:cover;border-radius:4px;display:block\">\n        <div style=\"display:flex;flex-direction:column;gap:4px\">\n          <p style=\"margin:0;font-weight:700;font-size:18px\">Monica Krauchthaler<\u002Fp>\n          <p style=\"margin:0;color:#6B716E;font-size:15px;line-height:1.5\">Craniosacral Therapeutin<\u002Fp>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"display:flex;flex-direction:column;gap:22px;font-size:17px;line-height:1.7;text-wrap:pretty\">\n        <p style=\"margin:0;font-size:13px;letter-spacing:.2em;text-transform:uppercase;font-weight:700;color:#8DB51A\">Über mich<\u002Fp>\n        <h2 style=\"margin:-8px 0 0;font-weight:300;font-size:clamp(28px,3.4vw,40px);line-height:1.15;letter-spacing:-.01em\">Mein Werdegang und meine Philosophie<\u002Fh2>\n        <p style=\"margin:0\">Auch mein eigener Lebensweg hat mich gelehrt, wie es sich anfühlt, an die eigenen Grenzen zu gelangen. Diese Erfahrungen haben meinen Wunsch wachsen lassen, Menschen nicht nur über ihre Symptome zu betrachten, sondern sie als einzigartige Persönlichkeiten mit ihrer Geschichte, ihren Ressourcen und ihren individuellen Bedürfnissen wahrzunehmen.<\u002Fp>\n        <p style=\"margin:0\">Als Fachperson in der psychiatrischen Pflege durfte ich Menschen in herausfordernden Lebenssituationen zur Seite stehen. In dieser täglichen Arbeit wurde mir immer wieder bewusst, wie eng Körper, Geist und Seele miteinander verbunden sind. Seelisches Leid zeigt sich oft auch körperlich – und umgekehrt beeinflusst körperliche Anspannung unser seelisches Wohlbefinden.<\u002Fp>\n        <p style=\"margin:0\">Schon früh waren mir Yoga und Meditation eine Hilfe, meine Achtsamkeit zu vertiefen und zu zeigen, wie wichtig es ist, dem Körper zuzuhören und ihm Raum für Ruhe und Regeneration zu geben. Aus diesem Interesse heraus habe ich mich kontinuierlich weitergebildet – unter anderem in Gestalttherapie, Körperwahrnehmung, Ernährung und Phytotherapie und stützende Gesprächsführung.<\u002Fp>\n        <p style=\"margin:0\">So begegnete ich der Craniosacral-Therapie. Ihre sanfte und zugleich tief wirkende Arbeitsweise hat mich von Anfang an berührt. Für mich verbindet sie medizinisches Wissen mit einer achtsamen Begleitung des Menschen als Ganzes.<\u002Fp>\n        <p style=\"margin:0\">In meiner Praxis <strong style=\"font-weight:700;color:#3F9587\">CranioImpuls<\u002Fstrong> in Stäfa ist es mir ein Herzensanliegen, einen geschützten, wertfreien und vertrauensvollen Raum zu schaffen. Einen Ort, an dem Sie zur Ruhe kommen, neue Kraft schöpfen und wieder in einen achtsamen Kontakt mit sich selbst finden können. Jede Begegnung ist einzigartig, deshalb richte ich jede Behandlung individuell nach Ihren Bedürfnissen, Ihren Ressourcen und Ihrem persönlichen Tempo aus.<\u002Fp>\n        <p style=\"margin:0;padding:22px 26px;border-radius:4px;background:#F1F5EA;font-size:19px;line-height:1.55;font-weight:400;color:#3A3F3D\">Heilung kann dort beginnen, wo wir uns sicher, verstanden und angenommen fühlen. Mit Empathie, Sorgfalt und Respekt begleite ich Sie dabei.<\u002Fp>\n        <p style=\"margin:0\">Ich freue mich darauf, Sie persönlich kennenzulernen und Sie ein Stück auf Ihrem Weg begleiten zu dürfen.<\u002Fp>\n        <p style=\"margin:0;font-family:'Caveat',cursive;font-size:30px;color:#9B3A8A\">Monica Krauchthaler<\u002Fp>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:40px;margin-top:64px;padding-top:40px;border-top:1px solid rgba(58,63,61,.1)\">\n      <div style=\"display:flex;flex-direction:column;gap:14px\">\n        <h3 style=\"margin:0;font-size:13px;letter-spacing:.2em;text-transform:uppercase;font-weight:700;color:#8DB51A\">Fachliche Weiterbildungen<\u002Fh3>\n        <ul style=\"margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:8px;font-size:17px;line-height:1.5\">\n          <li style=\"display:flex;gap:12px;align-items:baseline\"><span style=\"width:6px;height:6px;border-radius:50%;background:#3F9587;flex:none;position:relative;top:-2px\"><\u002Fspan>TRE® (Tension &amp; Trauma Releasing Exercises)<\u002Fli>\n          <li style=\"display:flex;gap:12px;align-items:baseline\"><span style=\"width:6px;height:6px;border-radius:50%;background:#3F9587;flex:none;position:relative;top:-2px\"><\u002Fspan>Trauma und Körperarbeit<\u002Fli>\n          <li style=\"display:flex;gap:12px;align-items:baseline\"><span style=\"width:6px;height:6px;border-radius:50%;background:#3F9587;flex:none;position:relative;top:-2px\"><\u002Fspan>NADA-Protokoll<\u002Fli>\n          <li style=\"display:flex;gap:12px;align-items:baseline\"><span style=\"width:6px;height:6px;border-radius:50%;background:#3F9587;flex:none;position:relative;top:-2px\"><\u002Fspan>Phytotherapie<\u002Fli>\n          <li style=\"display:flex;gap:12px;align-items:baseline\"><span style=\"width:6px;height:6px;border-radius:50%;background:#3F9587;flex:none;position:relative;top:-2px\"><\u002Fspan>Gestalttherapie<\u002Fli>\n        <\u002Ful>\n      <\u002Fdiv>\n      <div style=\"display:flex;flex-direction:column;gap:14px\">\n        <h3 style=\"margin:0;font-size:13px;letter-spacing:.2em;text-transform:uppercase;font-weight:700;color:#8DB51A\">Sprachen<\u002Fh3>\n        <ul style=\"margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:8px;font-size:17px;line-height:1.5\">\n          <li style=\"display:flex;gap:12px;align-items:baseline\"><span style=\"width:6px;height:6px;border-radius:50%;background:#3F9587;flex:none;position:relative;top:-2px\"><\u002Fspan>Deutsch – Muttersprache<\u002Fli>\n          <li style=\"display:flex;gap:12px;align-items:baseline\"><span style=\"width:6px;height:6px;border-radius:50%;background:#3F9587;flex:none;position:relative;top:-2px\"><\u002Fspan>Französisch – sehr gute Kenntnisse<\u002Fli>\n          <li style=\"display:flex;gap:12px;align-items:baseline\"><span style=\"width:6px;height:6px;border-radius:50%;background:#3F9587;flex:none;position:relative;top:-2px\"><\u002Fspan>Englisch – gute Kenntnisse<\u002Fli>\n        <\u002Ful>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <section id=\"behandlung\" style=\"background:rgba(241,245,234,.85)\">\n    <div style=\"max-width:1120px;margin:0 auto;padding:72px 28px\">\n      <p style=\"margin:0;font-size:13px;letter-spacing:.2em;text-transform:uppercase;font-weight:700;color:#8DB51A\">Behandlung<\u002Fp>\n      <h2 style=\"margin:14px 0 0;font-weight:300;font-size:clamp(28px,3.4vw,40px);line-height:1.15;letter-spacing:-.01em\">Was ist Craniosacral Therapie?<\u002Fh2>\n      <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:56px;margin-top:36px;align-items:start\">\n        <div style=\"display:flex;flex-direction:column;gap:20px;font-size:17px;line-height:1.7;text-wrap:pretty\">\n          <p style=\"margin:0\">Die Craniosacral-Therapie ist eine sanfte, ganzheitliche Körpertherapie, die den Menschen in seiner Gesamtheit betrachtet. Sie lädt dazu ein, zur Ruhe zu kommen, loszulassen und wieder in Kontakt mit den eigenen Ressourcen zu treten.<\u002Fp>\n          <p style=\"margin:0\">Mit feinen, achtsamen Berührungen werden Spannungen im Körper wahrgenommen. Das Nervensystem wird dabei unterstützt, in einen Zustand tiefer Entspannung zu finden – eine wichtige Voraussetzung für Regeneration und Wohlbefinden. In dieser Ruhe können die natürlichen Selbstregulations- und Selbstheilungskräfte des Körpers angeregt werden. Die Craniosacral-Therapie schafft Raum für Stille, fördert neues Gewahrsein, stärkt das Körperbewusstsein und schenkt oft ein Gefühl von Zentrierung, Erdung und innerem Frieden.<\u002Fp>\n          <p style=\"margin:0\">Der Schädel (<em>Cranium<\u002Fem>) und das Kreuzbein (<em>Sacrum<\u002Fem>) bilden die beiden Pole des craniosacralen Systems. Zu diesem gehören auch die Wirbelsäule, die Gehirn- und Rückenmarksflüssigkeit sowie die damit verbundenen Nerven, Faszien und Bindegewebe. Im gesunden Zustand bewegen sich diese Strukturen in feinen, rhythmischen Schwingungen, die Ausdruck eines lebendigen Zusammenspiels im Körper sind.<\u002Fp>\n          <p style=\"margin:0\">Die Craniosacral-Therapie orientiert sich am Gesunden und an den vorhandenen Ressourcen des Menschen. Sie folgt einer innewohnenden, ordnenden Kraft, die den Organismus in seiner Selbstheilung unterstützt. Diese rhythmische Kraft zeigt sich in subtilen Bewegungen der Gehirn- und Rückenmarksflüssigkeit, die mit geschulten Händen am ganzen Körper wahrgenommen werden kann. In ihrem Erleben können tiefe Ruhe, Geborgenheit, Leichtigkeit und eine vertiefte Atmung entstehen – <span style=\"font-family:'Caveat',cursive;font-size:24px;color:#9B3A8A;white-space:nowrap\">Stille bewegt.<\u002Fspan><\u002Fp>\n          <p style=\"margin:0\">Stress, Krankheit, Unfälle und emotionale Belastungen oder unverarbeitete Erfahrungen können diese natürlichen Bewegungen beeinträchtigen. Die Craniosacral-Therapie unterstützt den Körper dabei, Spannungen und Blockaden zu lösen und wieder zu seiner natürlichen Balance zurückzufinden. Durch achtsame Präsenz, feine Berührungen und gezielte Impulse wird die Selbstregulation des Organismus angeregt. Oft beginnt Veränderung bereits in dem Moment, in dem der Mensch sich selbst wieder bewusst wahrnimmt.<\u002Fp>\n          <p style=\"margin:0\">Die Craniosacral-Therapie kann Menschen unter anderem begleiten bei Erschöpfung, Burnout, Schlafstörungen, Ängsten, depressiven Belastungen, Tinnitus oder herausfordernden Lebensphasen. Jede Behandlung wird individuell auf den Menschen und seine Bedürfnisse abgestimmt.<\u002Fp>\n          <p style=\"margin:0\">In der Craniosacral-Therapie verbinden sich medizinisches Fachwissen, wissenschaftliche Erkenntnisse, Intuition und achtsame Präsenz zu einer Therapieform, die den Menschen in seiner Einzigartigkeit respektiert. Sie versteht sich als ganzheitliche Behandlung und kann ärztliche oder psychotherapeutische Therapien sinnvoll ergänzen und vertiefen.<\u002Fp>\n        <\u002Fdiv>\n        <div style=\"display:flex;flex-direction:column;gap:16px;position:sticky;top:150px\">\n          <h3 style=\"margin:0;font-weight:700;font-size:18px\">Indikationen<\u002Fh3>\n          <ul style=\"margin:0;padding:0;list-style:none;display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px 24px;font-size:17px;line-height:1.5\">\n            <li style=\"display:flex;gap:12px;align-items:baseline\"><span style=\"width:6px;height:6px;border-radius:50%;background:#3F9587;flex:none;position:relative;top:-2px\"><\u002Fspan>Schlafprobleme<\u002Fli>\n            <li style=\"display:flex;gap:12px;align-items:baseline\"><span style=\"width:6px;height:6px;border-radius:50%;background:#3F9587;flex:none;position:relative;top:-2px\"><\u002Fspan>Konzentrationsstörungen<\u002Fli>\n            <li style=\"display:flex;gap:12px;align-items:baseline\"><span style=\"width:6px;height:6px;border-radius:50%;background:#3F9587;flex:none;position:relative;top:-2px\"><\u002Fspan>Antriebslosigkeit<\u002Fli>\n            <li style=\"display:flex;gap:12px;align-items:baseline\"><span style=\"width:6px;height:6px;border-radius:50%;background:#3F9587;flex:none;position:relative;top:-2px\"><\u002Fspan>Kopfschmerzen<\u002Fli>\n            <li style=\"display:flex;gap:12px;align-items:baseline\"><span style=\"width:6px;height:6px;border-radius:50%;background:#3F9587;flex:none;position:relative;top:-2px\"><\u002Fspan>Tinnitus<\u002Fli>\n            <li style=\"display:flex;gap:12px;align-items:baseline\"><span style=\"width:6px;height:6px;border-radius:50%;background:#3F9587;flex:none;position:relative;top:-2px\"><\u002Fspan>Schleudertrauma<\u002Fli>\n            <li style=\"display:flex;gap:12px;align-items:baseline\"><span style=\"width:6px;height:6px;border-radius:50%;background:#3F9587;flex:none;position:relative;top:-2px\"><\u002Fspan>Gelenk- und Rückenbeschwerden<\u002Fli>\n          <\u002Ful>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <section id=\"kontakt\" style=\"max-width:1120px;margin:0 auto;padding:72px 28px 88px\">\n    <p style=\"margin:0;font-size:13px;letter-spacing:.2em;text-transform:uppercase;font-weight:700;color:#8DB51A\">Termine / Kontakt<\u002Fp>\n    <h2 style=\"margin:14px 0 0;font-weight:300;font-size:clamp(28px,3.4vw,40px);line-height:1.15;letter-spacing:-.01em\">Ich freue mich auf Ihren Anruf.<\u002Fh2>\n    <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:56px;margin-top:36px;align-items:start\">\n      <div style=\"display:flex;flex-direction:column;gap:32px;font-size:17px;line-height:1.6\">\n        <div style=\"display:flex;flex-direction:column;gap:10px\">\n          <h3 style=\"margin:0;font-weight:700;font-size:18px\">Termine<\u002Fh3>\n          <p style=\"margin:0\">Termine nach Vereinbarung – telefonisch unter<\u002Fp>\n          <a href=\"tel:+41792879955\" style=\"display:inline-flex;align-self:flex-start;align-items:center;gap:10px;padding:14px 22px;border-radius:999px;background:#3F9587;color:#fff;font-weight:700;font-size:18px;letter-spacing:.02em\" style-hover=\"background:#2F776C;color:#fff\">079 287 99 55<\u002Fa>\n        <\u002Fdiv>\n        <div style=\"display:flex;flex-direction:column;gap:6px\">\n          <h3 style=\"margin:0;font-weight:700;font-size:18px\">Praxis<\u002Fh3>\n          <p style=\"margin:0\">CranioImpuls · Monica Krauchthaler<br>Seidenhof, Häldelistrasse 9, 2. Stock<br>8712 Stäfa<br>5 Gehminuten vom Bahnhof Stäfa<\u002Fp>\n        <\u002Fdiv>\n        <div style=\"display:flex;flex-direction:column;gap:6px\">\n          <h3 style=\"margin:0;font-weight:700;font-size:18px\">Anfahrt &amp; Parkplätze<\u002Fh3>\n          <p style=\"margin:0\">Parkplätze finden Sie am Rütliweg 4, 8712 Stäfa – wenige Schritte von der Praxis entfernt.<\u002Fp>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"display:flex;flex-direction:column;gap:12px\">\n        <iframe title=\"Karte – Häldelistrasse 9, 8712 Stäfa\" src=\"https://maps.google.com/maps?
